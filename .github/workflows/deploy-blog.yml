# .github/workflows/deploy.yml — build Shirone with the private content repo, publish to Cloudflare Pages.
# Based on the theme's deploy example; content is fetched with a read-only deploy key.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   CONTENT_DEPLOY_KEY     private half of a read-only deploy key on the content repo
#   CLOUDFLARE_API_TOKEN   API token with only "Account → Cloudflare Pages → Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   BILI_SESSDATA          optional, only if the anime feature is used
#
# Variables (same page, "Variables" tab):
#   CONTENT_REPOSITORY     owner/name of the private content repo
#   PAGES_PROJECT          Cloudflare Pages project name

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - "README*.md"
      - "*.md"
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:
    inputs:
      content_ref:
        description: "Content repo ref or commit SHA (empty = main)"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * *"   # daily safety rebuild (04:17 UTC = 12:17 HKT)

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTENT_REPOSITORY: ${{ vars.CONTENT_REPOSITORY }}
  CONTENT_WORKING_COPY: .content-src
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      CONTENT_DIR: .content-src

    steps:
      - name: Check configuration
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CONTENT_REPOSITORY}" ] || missing="$missing CONTENT_REPOSITORY"
          [ -n "${PAGES_PROJECT}" ] || missing="$missing PAGES_PROJECT"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variable(s):$missing (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      - name: Resolve content ref
        id: target
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_SHA:-}"
          [ -n "$ref" ] || ref="${INPUT_REF:-}"
          [ -n "$ref" ] || ref="main"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout theme
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ steps.target.outputs.ref }}
          path: ${{ env.CONTENT_WORKING_COPY }}
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          persist-credentials: false

      - name: Record content commit
        id: content
        run: |
          set -euo pipefail
          echo "sha=$(git -C '${{ env.CONTENT_WORKING_COPY }}' rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            public/assets/moments/thumbnails
          key: ${{ runner.os }}-shirone-thumbnails-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-thumbnails-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Materialize content and config
        run: pnpm content:sync

      - name: Restore anime cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            src/data/anime-snapshots
            public/assets/anime/covers
          key: ${{ runner.os }}-shirone-anime-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-anime-

      - name: Sync anime data (best effort)
        run: pnpm anime:sync --if-stale
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      - name: Build site
        run: pnpm build
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@3 pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Shirone deploy"
            echo ""
            echo "- Content repo: \`${CONTENT_REPOSITORY}\`"
            echo "- Content ref: \`${{ steps.target.outputs.ref }}\`"
            echo "- Content commit: \`${{ steps.content.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"