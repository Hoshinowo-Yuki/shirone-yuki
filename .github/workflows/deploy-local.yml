name: Deploy to Production Server

on:
  push:
    branches: [ main ]

  workflow_dispatch:
  repository_dispatch:
    types: [ content-updated ]  # Must match event-type from trigger

# Push and content-updated deploys share one checkout; run them one at a time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      CONTENT_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.sha }}

    defaults:
      run:
        # Server checkout: set the DEPLOY_DIR repository variable to override;
        # otherwise it follows the repository name.
        working-directory: ${{ vars.DEPLOY_DIR || format('/prod-storage/srv/blog/{0}', github.event.repository.name) }}

    steps:
      - name: SSH Pre-Test
        run: |
          whoami
          ssh -T git@github.com-blog-repo || true

      - name: Update the server checkout
        run: |
          set -Eeuo pipefail
          git fetch --prune origin main
          git merge --ff-only origin/main
          git log -1 --oneline

      - name: Build and Deploy, without taking down the currently running site
        id: build
        run: |
          set -Eeuo pipefail
          docker compose build
          docker compose up -d --no-build

      - name: On success
        if: success()
        run: |
          echo "::notice title=Deployment succeeded::The site was rebuilt and started successfully."
          echo "Deployment succeeded." >> "$GITHUB_STEP_SUMMARY"

      - name: On failure
        if: failure()
        run: |
          echo "::error title=Deployment failed::The site build or startup failed."
          docker compose ps || true
          docker compose logs --tail=100 || true
          echo "Deployment failed. Check the logs above." >> "$GITHUB_STEP_SUMMARY"
          exit 1
